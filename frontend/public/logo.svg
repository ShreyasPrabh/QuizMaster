<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Neon Drop Shadow Filter -->
    <filter id="retro-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    
    <!-- Neon Gradients -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>

    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
  </defs>

  <!-- Background Neo-Brutalist Box -->
  <rect x="24" y="24" width="464" height="464" rx="48" fill="#0b0c16" stroke="#000000" stroke-width="16" filter="url(#retro-shadow)" />
  
  <!-- Outer Neon Frame -->
  <rect x="44" y="44" width="424" height="424" rx="36" fill="none" stroke="url(#neonPink)" stroke-width="8" opacity="0.9" />

  <!-- 8-BIT RETRO PIXEL INVADER GLYPH -->
  <g transform="translate(96, 70)" filter="url(#retro-shadow)">
    <!-- Top Antennas -->
    <rect x="56" y="0" width="28" height="28" fill="#ffe600" stroke="#000" stroke-width="4" />
    <rect x="236" y="0" width="28" height="28" fill="#ffe600" stroke="#000" stroke-width="4" />
    <rect x="84" y="28" width="28" height="28" fill="#ffe600" stroke="#000" stroke-width="4" />
    <rect x="208" y="28" width="28" height="28" fill="#ffe600" stroke="#000" stroke-width="4" />

    <!-- Head & Body Rows -->
    <rect x="56" y="56" width="208" height="28" fill="url(#neonCyan)" stroke="#000" stroke-width="4" />
    
    <rect x="28" y="84" width="264" height="28" fill="url(#neonCyan)" stroke="#000" stroke-width="4" />
    
    <!-- Eyes Row -->
    <rect x="0" y="112" width="320" height="28" fill="url(#neonCyan)" stroke="#000" stroke-width="4" />
    <!-- Left Eye Pupil (Cutout) -->
    <rect x="56" y="112" width="40" height="28" fill="#000000" />
    <rect x="68" y="118" width="16" height="16" fill="#ffe600" />
    <!-- Right Eye Pupil (Cutout) -->
    <rect x="224" y="112" width="40" height="28" fill="#000000" />
    <rect x="236" y="118" width="16" height="16" fill="#ffe600" />

    <!-- Chest & Arms -->
    <rect x="0" y="140" width="320" height="28" fill="url(#neonPink)" stroke="#000" stroke-width="4" />
    <rect x="0" y="168" width="56" height="28" fill="url(#neonPink)" stroke="#000" stroke-width="4" />
    <rect x="112" y="168" width="96" height="28" fill="url(#neonPink)" stroke="#000" stroke-width="4" />
    <rect x="264" y="168" width="56" height="28" fill="url(#neonPink)" stroke="#000" stroke-width="4" />

    <!-- Feet / Tentacles -->
    <rect x="28" y="196" width="56" height="28" fill="#39ff14" stroke="#000" stroke-width="4" />
    <rect x="236" y="196" width="56" height="28" fill="#39ff14" stroke="#000" stroke-width="4" />
  </g>

  <!-- Arcade Banner: QUIZCLUB -->
  <g transform="translate(48, 335)" filter="url(#retro-shadow)">
    <!-- Yellow neo-brutalist banner badge -->
    <rect x="0" y="0" width="416" height="74" rx="16" fill="url(#neonGold)" stroke="#000000" stroke-width="10" />
    <text x="208" y="48" font-family="'Space Grotesk', 'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="38" letter-spacing="4" fill="#000000" text-anchor="middle">
      QUIZCLUB
    </text>
  </g>

  <!-- Subtitle Tag: ARCADE -->
  <g transform="translate(180, 424)">
    <rect x="0" y="0" width="152" height="34" rx="8" fill="#ff007f" stroke="#000000" stroke-width="5" />
    <text x="76" y="24" font-family="'Courier New', monospace" font-weight="900" font-size="16" letter-spacing="3" fill="#ffffff" text-anchor="middle">
      ARCADE
    </text>
  </g>
</svg>
